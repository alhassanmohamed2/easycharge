name: easycharge
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.12.0
  image_picker: ^1.0.7
  flutter_phone_direct_caller: ^2.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  easy_localization: ^3.0.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.6
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/home_screen/
    - assets/team_member/
    - assets/options_background/
    - assets/translations/
    - assets/help/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_light.png
  color_dark: "#000000"
  image_dark: assets/splash_dark.png
  android: true
  ios: true
  web: true